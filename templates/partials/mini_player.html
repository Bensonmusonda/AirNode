{#
  partials/mini_player.html
  Persistent bottom mini-player bar attached to window.AirNodePlayer.
#}
<div class="mini-player-bar" 
     x-data="{
         track: null,
         isPlaying: false,
         currentTime: 0,
         duration: 0,
         isMuted: false,
         progressPct: 0,

         init() {
             if (window.AirNodePlayer) {
                 window.AirNodePlayer.subscribe(player => {
                     this.track = player.currentTrack;
                     this.isPlaying = player.isPlaying;
                     this.isMuted = player.isMuted;
                     if (player.currentTrack) {
                         this.currentTime = player.currentTrack.currentTime || 0;
                         this.duration = player.currentTrack.duration || 0;
                         this.progressPct = this.duration > 0 ? (this.currentTime / this.duration) * 100 : 0;
                     }
                 });
             }
         },
         formatTime(secs) {
             if (!isFinite(secs) || secs < 0) return '0:00';
             const m = Math.floor(secs / 60);
             const s = Math.floor(secs % 60).toString().padStart(2, '0');
             return `${m}:${s}`;
         },
         togglePlay() {
             if (window.AirNodePlayer) window.AirNodePlayer.togglePlayPause();
         },
         prevTrack() {
             if (window.AirNodePlayer) window.AirNodePlayer.playPrevInQueue();
         },
         nextTrack() {
             if (window.AirNodePlayer) window.AirNodePlayer.playNextInQueue();
         },
         openFullViewer() {
             // Opens the player WITHOUT resetting the track — just reveals the
             // existing viewer (audio keeps playing at its current position).
             window.__airnode?.openFullPlayer?.();
         }
     }"
     x-show="track !== null"
     style="display: none;"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-6"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-6">

    <div class="mini-player-progress" :style="`width: ${progressPct}%`"></div>

    <div class="mini-player-content" x-on:click="openFullViewer()">
        <div class="mini-player-art">
            <i data-lucide="music-2" style="width: 18px; height: 18px;"></i>
        </div>
        <div class="mini-player-info">
            <span class="mini-player-title" x-text="track?.title || 'Playing Media'"></span>
            <span class="mini-player-time" x-text="`${formatTime(currentTime)} / ${formatTime(duration)}`"></span>
        </div>
    </div>

    <div class="mini-player-controls" x-on:click.stop>
        <button class="mini-btn" x-on:click="prevTrack()" title="Previous">
            <i data-lucide="skip-back" style="width: 15px; height: 15px;"></i>
        </button>
        <button class="mini-btn primary" x-on:click="togglePlay()" title="Play/Pause">
            <span x-show="!isPlaying" style="display:flex;"><i data-lucide="play" style="width: 16px; height: 16px;"></i></span>
            <span x-show="isPlaying" style="display:flex;" x-cloak><i data-lucide="pause" style="width: 16px; height: 16px;"></i></span>
        </button>
        <button class="mini-btn" x-on:click="nextTrack()" title="Next">
            <i data-lucide="skip-forward" style="width: 15px; height: 15px;"></i>
        </button>
        <button class="mini-btn" x-on:click="openFullViewer()" title="Expand Player">
            <i data-lucide="maximize-2" style="width: 15px; height: 15px;"></i>
        </button>
    </div>
</div>
